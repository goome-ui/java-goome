name: update native

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
      HAS_BOT: ${{ secrets.BOT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.BOT_TOKEN || github.token }}
          fetch-depth: 0
      - name: check for a newer c-goome
        id: check
        run: |
          latest=$(gh release view -R goome-ui/c-goome --json tagName -q .tagName)
          latest=${latest#v}
          current=$(sed -n 's/^#define GOOME_VERSION "\(.*\)"/\1/p' native/goome.h)
          echo "c-goome $latest, vendored $current"
          if [ "$latest" = "$current" ] || [ "$(printf '%s\n%s\n' "$latest" "$current" | sort -V | tail -n 1)" != "$latest" ]; then
            echo "up to date"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "native-$latest" > /dev/null 2>&1; then
            echo "branch native-$latest already exists"
            exit 0
          fi
          if [ -n "$(gh pr list --state open --head "native-$latest" --json number -q '.[].number')" ]; then
            echo "a PR for native-$latest is already open"
            exit 0
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      - name: update native
        if: steps.check.outputs.latest != ''
        run: |
          latest=${{ steps.check.outputs.latest }}
          git clone --depth 1 --branch "v$latest" https://github.com/goome-ui/c-goome deps/c-goome
          tools/update_native.sh deps/c-goome "v$latest"
          rm -rf deps
          if [ -z "$(git status --porcelain native)" ]; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"
          git checkout -b "native-$latest"
          git add native
          git commit -m "Update native to $latest"
          git push origin "native-$latest"
          body="goome.h is now c-goome $latest. Run CI on this, then release the binding."
          if [ "$HAS_BOT" != true ]; then
            body="$body This PR was opened with the default token so CI doesnt start by itself, close and reopen the PR to run it."
          fi
          gh pr create --base dev --head "native-$latest" --title "Update native to $latest" --body "$body"

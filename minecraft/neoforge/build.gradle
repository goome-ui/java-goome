plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

group = 'io.github.goome-ui'
base {
    archivesName = 'goome-neoforge'
}

def root = file('../..')

sourceSets.main.java.srcDirs += [
    "$root/goome/src/main/java",
    "$root/goome/src/ffm/java",
    "$root/minecraft/common/src/main/java",
    "$root/minecraft/shared/src/main/java",
]
sourceSets.main.resources.srcDirs += ["$root/minecraft/shared/src/main/resources"]

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
        }
    }
    mods {
        goome {
            sourceSet(sourceSets.main)
        }
    }
}

processResources {
    def props = [version: project.version, minecraft_version: project.minecraft_version, neo_version: project.neo_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
    from("$root/build/natives") {
        into 'natives'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:-restricted']
}

jar {
    from("$root/LICENSE") {
        rename { "LICENSE_goome" }
    }
}

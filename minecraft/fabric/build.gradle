plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = 'io.github.goome-ui'
base {
    archivesName = 'goome-fabric'
}

def root = file('../..')

sourceSets.main.java.srcDirs += [
    "$root/goome/src/main/java",
    "$root/goome/src/ffm/java",
    "$root/minecraft/common/src/main/java",
    "$root/minecraft/shared/src/main/java",
]
sourceSets.main.resources.srcDirs += ["$root/minecraft/shared/src/main/resources"]

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

processResources {
    def version = project.version
    inputs.property 'version', version
    filesMatching('fabric.mod.json') {
        expand 'version': version
    }
    from("$root/build/natives") {
        into 'natives'
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:-restricted']
}

jar {
    from("$root/LICENSE") {
        rename { "LICENSE_goome" }
    }
}
